# Structural credential check -- the enforced gate.
#
# The same check runs pre-commit as fast feedback, but `git commit --no-verify`
# bypasses a local hook. This project's own argument is that a local gate is
# feedback while only the enforced gate is enforcement; that applies to us
# exactly as it applies to Conftest in CI and Gatekeeper at admission.
#
# Stdlib only, so there is no dependency install in front of the gate.

name: secrets-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-credential-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The suite runs first. A gate that cannot fire and a gate that has
      # nothing to fire on look identical from the outside, so prove the rules
      # still catch their adversarial cases before trusting a clean scan.
      # Pattern is test_check*, not test_*: this job installs nothing, and a
      # broader pattern would discover the analyser tests, whose imports need
      # dependencies that are deliberately absent here. The two jobs keep
      # disjoint, explicitly named patterns.
      - name: Adversarial suite
        run: python3 -m unittest discover -s scripts/probe -p 'test_check*.py' -v

      - name: Structural credential check
        run: python3 scripts/probe/check_no_secrets.py

  # Separate job: the analyser needs dependencies, and the credential gate above
  # must stay installable-free so nothing runs ahead of it.
  analyser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/probe/requirements.txt
      # Broad pattern is safe here: this job installs everything, so it also
      # re-runs the credential suite as redundancy.
      - name: Analyser and probe regressions
        run: python3 -m unittest discover -s scripts/probe -p 'test_*.py' -v
