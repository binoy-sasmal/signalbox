# Stage 0 feed probe -- run 1: keyless feeds only.
#
# CH (opentransportdata.swiss) and FI (HSL) wait on API keys and are run 2.
# Key acquisition must not block Gate 0, which needs three usable feeds; run 1
# has exactly three candidates.
#
# Endpoints are stored split -- base_url plus a query map -- and never as a
# joined URL. Auth-bearing query parameters are written as
# "<redacted:auth_ref>" and resolved at request time from a secret that never
# enters this file. Run 1 has no keyed feed; the mechanism exists now because
# retrofitting it after a key exists is how the leak happens.

run: run1
duration_minutes: 60

# Identify ourselves. gtfs.de is a free community service and 720 requests an
# hour should be attributable to a human who can be emailed.
# The poller refuses to start while the <contact> placeholder is present.
# Temporary address for run 1. Replace with a durable one before run 2, and do
# not use it for the OVapi licence correspondence -- a reply needs somewhere
# that will still exist.
user_agent: "signalbox-probe/0.1 (Stage 0 feed feasibility spike; contact: selil23188@archifun.com)"
accept_encoding: "gzip, deflate"

kill_switch_file: "STOP"
output_root: "runs"

timeouts:
  connect_s: 5
  total_s: 20

# Test C -- the deliberate perturbation. Two off-grid requests a short gap
# apart: the same snapshot should carry the same FeedHeader.timestamp, so
# timestamps that differ by roughly the gap and track our request times are
# echo behaviour, observed directly rather than inferred.
async_repoll:
  gap_seconds: 2
  at_minutes: [12, 38]

# Backoff on 429/403. Retries consume rate budget like any other request;
# there is no immediate-retry path anywhere in the poller.
backoff:
  cap_seconds: 900
  consecutive_429_to_stop: 3

# Static-content guard for Test A. Below either threshold the feed's content is
# too static to read Test A from: a degraded producer that still regenerates on
# schedule but emits a near-empty snapshot yields identical content alongside a
# legitimately advancing timestamp, which is Test A's echo signature from the
# opposite cause. Test A is marked unavailable rather than misread.
static_content_guard:
  min_median_entities: 10
  min_median_semantic_churn: 0.05

feeds:
  - id: gtfs_de
    base_url: "https://realtime.gtfs.de/realtime-free.pb"
    query: {}
    auth: none
    sleep_after_completion_s: 5
    documented_limit: null
    self_imposed_ceiling: {requests: 15, window_s: 60}
    async_repoll: true
    notes: >-
      Documented 10s updates, so 5s is a 2x oversample and cadence jitter is
      resolvable. No documented rate limit is known, so the ceiling is ours and
      not theirs -- recorded that way so metrics.md cannot later present it as
      an upstream fact.

  - id: vbb
    base_url: "https://production.gtfsrt.vbb.de/data"
    query: {}
    auth: none
    sleep_after_completion_s: 5
    documented_limit: {requests: 60, window_s: 60}
    self_imposed_ceiling: {requests: 15, window_s: 60}
    async_repoll: true
    notes: >-
      12 req/min against a documented 60/min, so 20% of budget. Degraded since
      2026-06-04: if content is static the analyser marks Test A unavailable and
      Test C carries the verdict.

  # OVapi exposes four separate endpoints: tripUpdates, vehiclePositions,
  # alerts, trainUpdates. Each is its own message stream and may stamp its
  # header differently, so each would need its own feed id and its own verdict.
  # One endpoint, one feed, one verdict -- never merged. Run 1 probes
  # tripUpdates only.
  - id: ovapi_tripupdates
    base_url: "https://gtfs.ovapi.nl/nl/tripUpdates.pb"
    query: {}
    auth: none
    sleep_after_completion_s: 60
    documented_limit: null
    self_imposed_ceiling: {requests: 2, window_s: 60}
    async_repoll: true
    licence: unresolved
    attribution: unresolved
    licence_sources:
      - "http://gtfs.ovapi.nl/README"
      - "https://mobilitydatabase.org/feeds/gtfs_rt/mdb-1645"
    licence_checked: "2026-08-28"
    licence_status: >-
      Use is explicitly permitted by the README ("You are free to use this
      data, but there is no service level agreement (best-effort) nor are you
      allowed to say you represent or impersonate any of the transit agencies
      listed here"). No SPDX identifier and no required attribution string for
      general use; the citation block in the README is scoped to a scientific
      usage policy, and Mobility Database points at a different terms URL.
      No enquiry sent to ovinfo@ovapi.nl and none planned; see docs/metrics.md.
    notes: >-
      60s, not 15s: the payload is 5.6 MB, and at 15s an hour of polling could
      move ~1.3 GB from a sponsored volunteer service if validators are not
      honoured. 60 requests an hour still supports Tests B, D and E, and Test
      C's two off-grid fetches are unaffected. If conditional requests are
      honoured the volume collapses; if they are not, that is a finding and
      60s bounds the damage while we learn it. The README additionally
      *requires* a descriptive User-Agent, conditional requests and gzip --
      all of which the poller already does.
